# OpenADUC — dev overlay.
#
# Combine with the base file:
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Adds source mounts (so api/web hot-reload on save) and exposes the
# Postgres port for direct psql access. For a local directory, run
# `pnpm dc:up` (see dev/samba-dc/README.md).

services:
  postgres:
    ports:
      - '5432:5432'

  api:
    command: ['pnpm', 'dev']
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/api/node_modules

  web:
    command: ['pnpm', 'dev', '--host', '0.0.0.0']
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
