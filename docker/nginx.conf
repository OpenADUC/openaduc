# HSTS only when the request reached the outer proxy over TLS: this
# container speaks plain HTTP, and HSTS over HTTP is ignored anyway.
map "$scheme:$http_x_forwarded_proto" $openaduc_hsts {
  ~https "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 80;
  server_name _;

  # The SPA loads its own scripts only; fonts come from Google Fonts. Inline
  # styles are needed for the theme bootstrap in index.html and PrimeVue.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $openaduc_hsts always;

  root /usr/share/nginx/html;
  index index.html;

  # Static SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Liveness and readiness for monitoring; the API port itself isn't
  # published.
  location = /health/live {
    proxy_pass http://api:3000/health/live;
  }
  location = /health/ready {
    proxy_pass http://api:3000/health/ready;
  }

  # Proxy API calls to the backend service inside the compose network.
  # The API trusts exactly one proxy hop (TRUST_PROXY_HOPS=1): this one.
  # $proxy_add_x_forwarded_for appends the real peer, so anything a client
  # put in X-Forwarded-For stays beyond the trusted hop and is ignored.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }
}
