server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Liveness and readiness for monitoring; the API port itself isn't
  # published.
  location = /health/live {
    proxy_pass http://api:3000/health/live;
  }
  location = /health/ready {
    proxy_pass http://api:3000/health/ready;
  }

  # Proxy API calls to the backend service inside the compose network.
  # The API trusts exactly one proxy hop (TRUST_PROXY_HOPS=1): this one.
  # $proxy_add_x_forwarded_for appends the real peer, so anything a client
  # put in X-Forwarded-For stays beyond the trusted hop and is ignored.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }
}
